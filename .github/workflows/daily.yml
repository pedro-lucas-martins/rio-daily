name: Rio Daily
on:
  schedule:
    - {cron: "0 11 * * *"}      # 08:00 in Rio: everything + newsletter
    - {cron: "30 1-9/2,13-23/2 * * *"}  # every 2 hours: news and zones
  workflow_dispatch:
    inputs:
      approve: {description: "ID of a pending item to approve (blank = just update)", required: false, type: string}
permissions: {contents: read}
concurrency: {group: rio-daily, cancel-in-progress: false}
jobs:
  collect:
    # Scheduled runs stay off until the repository variable ENABLED is set to true.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v7
        with: {ref: main}
      - uses: actions/setup-python@v7
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/cache@v6
        with: {path: models, key: translate-pb_en-1_9}
      - name: Approve
        if: inputs.approve != ''
        env: {ITEM: "${{ inputs.approve }}"}
        run: python -m rio approve "$ITEM"
      - name: Collect and build
        env:
          MODE: ${{ github.event.schedule == '0 11 * * *' && 'daily' || 'news' }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FOGOCRUZADO_EMAIL: ${{ secrets.FOGOCRUZADO_EMAIL }}
          FOGOCRUZADO_PASSWORD: ${{ secrets.FOGOCRUZADO_PASSWORD }}
        run: python -m rio "$MODE" && python -m rio pending
      - uses: actions/upload-pages-artifact@v5
        with: {path: site}
      - name: Save data
        if: always()
        run: |
          git config user.name "rio-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update data"
          git pull --rebase && git push
  # Separate job: in the same job GitHub may not find the artifact yet (actions/deploy-pages#451).
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions: {pages: write, id-token: write}
    environment: {name: github-pages, url: "${{ steps.pages.outputs.page_url }}"}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
  newsletter:
    needs: deploy
    if: github.event.schedule == '0 11 * * *'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v7
        with: {ref: main}
      - uses: actions/setup-python@v7
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - name: Send
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NEWSLETTER_TO: ${{ secrets.NEWSLETTER_TO }}
        run: python -m rio send
      - name: Save data
        if: always()
        run: |
          git config user.name "rio-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update data"
          git pull --rebase && git push
