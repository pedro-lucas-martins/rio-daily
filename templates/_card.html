{% macro card(i) %}<article class="card {{ i.tone }}" data-tone="{{ i.tone }}"><span class="tag">{{ tones[i.tone] }}</span>
<h3><a href="{{ i.url }}" target="_blank" rel="noopener">{{ i.title }}</a></h3>{% if i.summary %}<p>{{ i.summary }}</p>{% endif %}
<small>{{ i.source }}, {{ i.date }}{% if i.translated %}. Translated from Portuguese by machine: check the source{% endif %}</small></article>{% endmacro %}
