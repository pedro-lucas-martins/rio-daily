{% extends "base.html" %}{% from "_card.html" import card with context %}{% block main %}<h1>News</h1><div class="filters"><button data-f="all" aria-pressed="true">All</button>{% for k, v in tones.items() %}<button data-f="{{ k }}" aria-pressed="false">{{ v }}</button>{% endfor %}</div>
<div class="grid">{% for i in items %}{{ card(i) }}{% else %}<p>No news available right now.</p>{% endfor %}</div>
<script>document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('[data-tone]').forEach(c=>c.hidden=b.dataset.f!=='all'&&c.dataset.tone!==b.dataset.f)})</script>{% endblock %}
